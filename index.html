<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动通知管理</title>
    <style>
        :root {
            --primary: #4f6ef7;
            --primary-dark: #3d5ae0;
            --primary-light: #eef1fe;
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2430;
            --text-muted: #8a91a3;
            --border: #e7eaf2;
            --danger: #ef5350;
            --danger-dark: #d9413e;
            --success: #22a06b;
            --radius: 14px;
            --shadow-sm: 0 1px 3px rgba(23, 43, 99, .06);
            --shadow: 0 6px 24px rgba(23, 43, 99, .08);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- 顶部导航 ---------- */
        header {
            background: linear-gradient(120deg, #4f6ef7 0%, #6a5cf0 100%);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff;
            box-shadow: 0 2px 12px rgba(79, 110, 247, .28);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .5px;
        }
        header .brand .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255,255,255,.22);
        }
        header .spacer { flex: 1; }
        header a.cta {
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            background: rgba(255,255,255,.16);
            padding: 8px 16px;
            border-radius: 999px;
            transition: background .18s, transform .18s;
            border: 1px solid rgba(255,255,255,.25);
        }
        header a.cta:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }

        main {
            max-width: 1060px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 22px 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: box-shadow .2s;
        }
        .card:hover { box-shadow: var(--shadow); }
        .card h2 {
            margin: 0 0 16px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2::before {
            content: '';
            width: 4px;
            height: 16px;
            border-radius: 2px;
            background: var(--primary);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .form-row input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            width: 200px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            background: #fbfcfe;
        }
        #dateInput { width: 250px; }
        #locationInput { width: 150px; }
        #linkInput { width: 260px; }
        .form-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: #fff;
        }
        .form-row input::placeholder { color: #b3bac9; }

        button {
            padding: 9px 18px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background .16s, transform .1s, box-shadow .16s;
            box-shadow: 0 2px 6px rgba(79, 110, 247, .28);
        }
        button:hover { background: var(--primary-dark); }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: .55; cursor: not-allowed; }
        button.secondary {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
        }
        button.secondary:hover { background: #f4f6fb; }
        button.danger { background: var(--danger); box-shadow: 0 2px 6px rgba(239,83,80,.28); }
        button.danger:hover { background: var(--danger-dark); }
        button.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }

        #msg {
            min-height: 22px;
            margin: 12px 0 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #msg.ok { color: var(--success); }
        #msg.err { color: var(--danger); }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        .toolbar input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 250px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            background: #fbfcfe;
        }
        .toolbar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: #fff;
        }
        .toolbar .spacer { flex: 1; }
        .api-info {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--primary-light);
            padding: 5px 12px;
            border-radius: 999px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
            overflow: hidden;
            border-radius: 12px;
        }
        th, td {
            padding: 13px 10px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }
        thead th {
            background: #f7f8fc;
            font-weight: 600;
            color: #5b6172;
            font-size: 13px;
            letter-spacing: .5px;
        }
        tbody tr { transition: background .14s; }
        tbody tr:hover { background: #f6f8ff; }
        tbody tr:last-child td { border-bottom: none; }
        td a { color: var(--primary); text-decoration: none; font-weight: 500; }
        td a:hover { text-decoration: underline; }

        /* ---------- 三态：加载中 / 空数据 / 请求失败 ---------- */
        .state-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 56px 20px;
            color: var(--text-muted);
            text-align: center;
        }
        .state-panel p { margin: 0; font-size: 15px; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .state-icon { font-size: 44px; line-height: 1; }
        .state-title { font-size: 16px; font-weight: 600; color: var(--text); }
        .state-detail {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 560px;
            word-break: break-all;
            line-height: 1.6;
        }
        .retry-btn { margin-top: 4px; }

        [hidden] { display: none !important; }

        @media (max-width: 640px) {
            header { padding: 0 16px; }
            .form-row input, #dateInput, #locationInput, #linkInput { width: 100%; }
            main { padding: 16px 10px 40px; }
            .card { padding: 18px 16px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span class="dot"></span>
            <span>活动通知管理</span>
        </div>
        <div class="spacer"></div>
        <a class="cta" href="chat.html">💬 AI 对话助手</a>
    </header>

    <main>
        <!-- ========== 新增 / 编辑表单 ========== -->
        <section class="card">
            <h2 id="formTitle">新增活动</h2>
            <form id="activityForm">
                <div class="form-row">
                    <input type="text" id="nameInput" placeholder="活动名称（必填）">
                    <input type="text" id="dateInput" placeholder="日期，如 2027年5月1日（必填）">
                    <input type="text" id="locationInput" placeholder="地点（必填）">
                    <input type="text" id="linkInput" class="link-input" placeholder="详情页链接（可选）">
                    <button type="submit" id="submitBtn">新增</button>
                    <button type="button" id="cancelBtn" class="secondary" hidden>取消修改</button>
                </div>
            </form>
            <p id="msg"></p>
        </section>

        <!-- ========== 列表区：三态都在这里切换 ========== -->
        <section class="card">
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="搜索活动名称..." onkeyup="filterTable()">
                <button type="button" id="refreshBtn" class="secondary">刷新列表</button>
                <span class="spacer"></span>
                <span class="api-info" id="apiInfo"></span>
            </div>

            <!-- 加载中 / 空数据 / 请求失败 共用这个面板 -->
            <div id="listState" class="state-panel"></div>

            <table id="activityTable" hidden>
                <thead>
                    <tr>
                        <th>活动名称</th>
                        <th>日期</th>
                        <th>地点</th>
                        <th style="width:150px">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </section>
    </main>

    <!-- config.js：前端配置（后端地址），业务代码不写死 -->
    <script src="config.js"></script>
    <script>
        // =====================================================
        //  首页逻辑：负责「活动」的增删改查
        //  简单流程：
        //    加载列表 → 渲染表格 → 用户新增/编辑/删除 → 调后端接口 → 刷新列表
        // =====================================================
        (function () {
            'use strict';

            // ---------- 读取配置 ----------
            var cfg = window.APP_CONFIG || {};
            var API_BASE = String(cfg.API_BASE || '').replace(/\/+$/, '');

            // ---------- 页面元素 ----------
            var els = {
                form: document.getElementById('activityForm'),
                formTitle: document.getElementById('formTitle'),
                name: document.getElementById('nameInput'),
                date: document.getElementById('dateInput'),
                location: document.getElementById('locationInput'),
                link: document.getElementById('linkInput'),
                submit: document.getElementById('submitBtn'),
                cancel: document.getElementById('cancelBtn'),
                msg: document.getElementById('msg'),
                search: document.getElementById('searchInput'),
                refresh: document.getElementById('refreshBtn'),
                listState: document.getElementById('listState'),
                table: document.getElementById('activityTable'),
                tbody: document.getElementById('tableBody'),
                apiInfo: document.getElementById('apiInfo')
            };

            var activities = [];
            var editingId = null;

            // ---------- 工具函数 ----------
            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function showMsg(text, type) {
                els.msg.textContent = text || '';
                els.msg.className = type === 'ok' ? 'ok' : (type === 'err' ? 'err' : '');
            }

            function sleep(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            // ---------- 统一请求：校验 { code, data, msg } ----------
            async function request(path, options) {
                var res = await fetch(API_BASE + path, options);
                var body;
                try {
                    body = await res.json();
                } catch (e) {
                    throw new Error('服务器返回的不是 JSON（HTTP ' + res.status + '）');
                }
                if (body.code !== 0) {
                    throw new Error(body.msg || ('请求失败（HTTP ' + res.status + '）'));
                }
                return body.data;
            }

            // ---------- 三态渲染 ----------
            function showLoading() {
                els.table.hidden = true;
                els.listState.hidden = false;
                els.listState.innerHTML =
                    '<div class="spinner"></div>' +
                    '<p>正在加载活动列表…</p>';
            }

            function showEmpty() {
                els.table.hidden = true;
                els.listState.hidden = false;
                els.listState.innerHTML =
                    '<div class="state-icon">📭</div>' +
                    '<p class="state-title">暂无活动数据</p>' +
                    '<p class="state-detail">列表为空。可以在上方表单新增一条活动。</p>';
            }

            function showError(message, rawDetail) {
                els.table.hidden = true;
                els.listState.hidden = false;
                // 用 innerHTML 一次性拼出错误面板，比逐个 createElement 更短
                els.listState.innerHTML =
                    '<div class="state-panel" style="padding:0">' +
                    '<div class="state-icon">⚠️</div>' +
                    '<p class="state-title">请求失败</p>' +
                    '<p class="state-detail">' + escapeHtml(message || '未知错误') + '</p>' +
                    (rawDetail ? '<p class="state-detail" style="font-size:12px;color:#bbb">原始错误：' + escapeHtml(rawDetail) + '</p>' : '') +
                    '<button type="button" class="retry-btn" onclick="loadActivities()">重试</button>' +
                    '</div>';
            }

            // 把浏览器的英文网络错误翻译成能看懂的中文提示
            function friendlyError(e) {
                var msg = (e && e.message) ? e.message : String(e);
                if (e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(msg)) {
                    return '无法连接后端服务。请确认已运行 node app.js，并检查 config.js 里的 API_BASE 地址是否正确（也可能是 CORS 被拦截）。';
                }
                return msg;
            }

            function showReady() {
                els.listState.hidden = true;
                els.table.hidden = false;
            }

            // ---------- 渲染表格 ----------
            function renderTable() {
                els.tbody.innerHTML = '';
                activities.forEach(function (a) {
                    var tr = document.createElement('tr');

                    var nameHtml = a.link
                        ? '<a href="' + escapeHtml(a.link) + '">' + escapeHtml(a.name) + '</a>'
                        : escapeHtml(a.name);

                    tr.innerHTML =
                        '<td>' + nameHtml + '</td>' +
                        '<td>' + escapeHtml(a.date) + '</td>' +
                        '<td>' + escapeHtml(a.location) + '</td>' +
                        '<td>' +
                        '<button class="small" onclick="startEdit(' + a.id + ')">编辑</button> ' +
                        '<button class="small danger" onclick="deleteActivity(' + a.id + ')">删除</button>' +
                        '</td>';

                    els.tbody.appendChild(tr);
                });
            }

            function filterTable() {
                var filter = els.search.value.toUpperCase();
                var trs = els.tbody.querySelectorAll('tr');
                for (var i = 0; i < trs.length; i++) {
                    var td = trs[i].getElementsByTagName('td')[0];
                    if (!td) continue;
                    var txt = (td.textContent || td.innerText || '').toUpperCase();
                    trs[i].style.display = txt.indexOf(filter) > -1 ? '' : 'none';
                }
            }

            // ---------- 加载列表（三态核心） ----------
            async function loadActivities() {
                if (!window.APP_CONFIG) {
                    showError('未找到配置：请检查 config.js 是否被正确引入');
                    return;
                }

                showLoading();
                var startedAt = Date.now();

                try {
                    var data = await request('/api/activities');
                    if (!Array.isArray(data)) {
                        throw new Error('返回数据格式异常：期望数组');
                    }
                    activities = data;

                    // 保证"加载中"状态至少可见 500ms，避免一闪而过
                    var elapsed = Date.now() - startedAt;
                    if (elapsed < 500) await sleep(500 - elapsed);

                    renderTable();
                    if (activities.length === 0) {
                        showEmpty();
                    } else {
                        showReady();
                    }
                    showMsg('');
                } catch (e) {
                    var elapsed2 = Date.now() - startedAt;
                    if (elapsed2 < 500) await sleep(500 - elapsed2);
                    showError(friendlyError(e), e.message);
                }
            }

            // ---------- 表单：新增 / 编辑 ----------
            function clearForm() {
                els.name.value = '';
                els.date.value = '';
                els.location.value = '';
                els.link.value = '';
            }

            function enterEditMode(id) {
                var a = activities.find(function (x) { return x.id === id; });
                if (!a) return;
                editingId = id;
                els.name.value = a.name;
                els.date.value = a.date;
                els.location.value = a.location;
                els.link.value = a.link || '';
                els.formTitle.textContent = '编辑活动（ID ' + id + '）';
                els.submit.textContent = '保存修改';
                els.cancel.hidden = false;
            }

            function exitEditMode() {
                editingId = null;
                clearForm();
                els.formTitle.textContent = '新增活动';
                els.submit.textContent = '新增';
                els.cancel.hidden = true;
            }

            async function handleSubmit(ev) {
                ev.preventDefault();

                var name = els.name.value.trim();
                var date = els.date.value.trim();
                var location = els.location.value.trim();
                var link = els.link.value.trim();

                if (!name || !date || !location) {
                    showMsg('请填写完整：活动名称、日期、地点都不能为空', 'err');
                    return;
                }

                var payload = { name: name, date: date, location: location };
                if (link) payload.link = link;

                els.submit.disabled = true;
                try {
                    if (editingId === null) {
                        await request('/api/activities', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        showMsg('新增成功', 'ok');
                    } else {
                        await request('/api/activities/' + editingId, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        showMsg('修改成功', 'ok');
                    }
                    exitEditMode();
                    await loadActivities();      // 增删改后自动刷新列表
                } catch (e) {
                    showMsg(e.message, 'err');
                } finally {
                    els.submit.disabled = false;
                }
            }

            // ---------- 删除（成功后自动刷新） ----------
            async function deleteActivity(id) {
                if (!window.confirm('确定删除这条活动吗？')) return;

                try {
                    await request('/api/activities/' + id, { method: 'DELETE' });
                    if (editingId === id) exitEditMode();
                    showMsg('删除成功', 'ok');
                    await loadActivities();      // 删除后自动刷新列表
                } catch (e) {
                    showMsg(e.message, 'err');
                }
            }

            // ---------- 暴露给内联 onclick ----------
            window.startEdit = enterEditMode;
            window.deleteActivity = deleteActivity;
            window.filterTable = filterTable;
            window.loadActivities = loadActivities;

            // ---------- 事件绑定 ----------
            els.form.addEventListener('submit', handleSubmit);
            els.cancel.addEventListener('click', exitEditMode);
            els.refresh.addEventListener('click', loadActivities);

            // ---------- 启动 ----------
            els.apiInfo.textContent = '后端：' + (API_BASE ? API_BASE : '同源（当前站点）');
            loadActivities();
        })();
    </script>
</body>
</html>
