<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动通知管理</title>

<style>
/* 颜色配置：改这一行就换整套配色（主色=顶栏/按钮，红=删除） */
:root { --主色:#5b6ef5; --背景:#f4f6fc; --白:#fff; --字:#1f2430; --灰:#8a91a3; --线:#e8ebf5; --红:#ef5350; }

/* ===== 样式 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: var(--背景); color: var(--字); }

header { background: var(--主色); color: #fff; height: 56px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
header a { color: #fff; font-size: 14px; text-decoration: none; }

/* 白盒子 */
.box { background: var(--白); max-width: 820px; margin: 18px auto; padding: 16px;
  border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
h2 { font-size: 15px; margin-bottom: 12px; padding-left: 8px; border-left: 3px solid var(--主色); }

input { padding: 9px 12px; border: 1px solid var(--线); border-radius: 8px;
  font-size: 14px; outline: none; }
input:focus { border-color: var(--主色); }
button { padding: 9px 14px; border: none; border-radius: 8px; font-size: 14px;
  background: var(--主色); color: #fff; cursor: pointer; }
.灰 { background: var(--线); color: var(--字); }
.红 { background: var(--红); }

/* 一行排开，输入框自动伸缩 */
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.row input { flex: 1; min-width: 120px; }

/* 每条活动 */
.item { display: flex; align-items: center; gap: 10px; padding: 12px;
  border-bottom: 1px solid var(--线); }
.item b { font-size: 15px; }
.item span { font-size: 13px; color: var(--灰); }
.grow { flex: 1; }
.item a { color: var(--主色); }

#提示 { font-size: 14px; height: 20px; }
.tip { text-align: center; color: var(--灰); padding: 30px 0; font-size: 14px; }
</style>
</head>

<body>

<header>
  <b>📋 活动通知管理</b>
  <a href="chat.html">💬 AI 助手</a>
</header>

<!-- 新增 / 修改 -->
<div class="box">
  <h2 id="标题">新增活动</h2>
  <form id="表单">
    <div class="row">
      <input id="名称" placeholder="活动名称">
      <input id="日期" placeholder="日期，如 2027年5月1日">
      <input id="地点" placeholder="地点">
      <input id="链接" placeholder="详情页链接（可选）">
    </div>
    <div class="row">
      <button>保存</button>
      <button type="button" class="灰" id="取消" hidden>取消</button>
    </div>
    <p id="提示"></p>
  </form>
</div>

<!-- 搜索 + 列表 -->
<div class="box">
  <div class="row">
    <input id="搜索" placeholder="🔍 搜索活动名称">
    <button type="button" class="灰" id="刷新">刷新</button>
  </div>
  <div id="列表"></div>
</div>

<script src="config.js"></script>
<script>
/* ===== 全部代码就这些，从上往下读 ===== */

var 地址 = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";  // 后端地址
var 列表 = [];     // 所有活动
var 改id = null;   // 正在改哪一条；null 表示新增

function 取(id) { return document.getElementById(id); }

// 把 < > 转义，防止活动名弄坏页面
function 防(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 发请求，只返回 data
async function 请求(路径, 选项) {
  var 回应 = await fetch(地址 + 路径, 选项);
  var 结果 = await 回应.json();
  if (结果.code !== 0) throw new Error(结果.msg);
  return 结果.data;
}

// ---------- 画列表 ----------
function 画() {
  var 词 = 取("搜索").value;
  var 网页 = "";
  for (var i = 0; i < 列表.length; i++) {
    var a = 列表[i];
    if (词 && a.name.indexOf(词) < 0) continue;   // 不符合搜索就跳过
    var 名 = a.link ? '<a href="' + 防(a.link) + '" target="_blank">' + 防(a.name) + "</a>"
                    : 防(a.name);
    网页 += '<div class="item"><div class="grow"><b>' + 名 + "</b><br>" +
            "<span>📅 " + 防(a.date) + "　📍 " + 防(a.location) + "</span></div>" +
            '<button class="灰" onclick="编辑(' + a.id + ')">改</button>' +
            '<button class="红" onclick="删除(' + a.id + ')">删</button></div>';
  }
  取("列表").innerHTML = 网页 || '<div class="tip">还没有活动</div>';
}

// ---------- 加载列表 ----------
async function 加载() {
  取("列表").innerHTML = '<div class="tip">加载中…</div>';
  try {
    列表 = await 请求("/api/activities");
    画();
  } catch (错误) {
    取("列表").innerHTML = '<div class="tip">连不上后端：' + 防(错误.message) + "</div>";
  }
}

// ---------- 清空表单 ----------
function 清空() {
  var 框 = ["名称", "日期", "地点", "链接"];
  for (var i = 0; i < 框.length; i++) 取(框[i]).value = "";
  改id = null;
  取("标题").textContent = "新增活动";
  取("取消").hidden = true;
}

// ---------- 点"改"：把这条填进表单 ----------
function 编辑(id) {
  for (var i = 0; i < 列表.length; i++) {
    if (列表[i].id !== id) continue;
    var a = 列表[i];
    改id = id;
    取("名称").value = a.name;
    取("日期").value = a.date;
    取("地点").value = a.location;
    取("链接").value = a.link || "";
    取("标题").textContent = "修改活动（ID " + id + "）";
    取("取消").hidden = false;
  }
}

// ---------- 点"删" ----------
async function 删除(id) {
  if (!confirm("确定删除？")) return;
  try {
    await 请求("/api/activities/" + id, { method: "DELETE" });
    加载();
  } catch (错误) {
    取("提示").textContent = 错误.message;
  }
}

// ---------- 点"保存"（新增或修改） ----------
取("表单").onsubmit = async function (事件) {
  事件.preventDefault();   // 别让页面刷新

  var 数据 = {
    name: 取("名称").value,
    date: 取("日期").value,
    location: 取("地点").value,
    link: 取("链接").value
  };
  if (!数据.name || !数据.date || !数据.location) {
    取("提示").textContent = "名称、日期、地点都要填";
    return;
  }

  var 选项 = { method: "POST", headers: { "Content-Type": "application/json" },
               body: JSON.stringify(数据) };
  var 路径 = "/api/activities";
  if (改id !== null) {        // 有 id 就是修改
    选项.method = "PUT";
    路径 = 路径 + "/" + 改id;
  }

  try {
    await 请求(路径, 选项);
    取("提示").textContent = "保存成功";
    清空();
    加载();
  } catch (错误) {
    取("提示").textContent = 错误.message;
  }
};

// ---------- 启动 ----------
取("取消").onclick = 清空;
取("刷新").onclick = 加载;
取("搜索").oninput = 画;   // 边打字边过滤
加载();
</script>
</body>
</html>
