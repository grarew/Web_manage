# Render 部署蓝图（https://render.com）
# 在 Render 控制台选 "New +" → "Blueprint"，指向这个仓库即可。
services:
  - type: web
    name: web-manage-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node app.js
    healthCheckPath: /api/activities
    envVars:
      - key: NODE_VERSION
        value: 20
