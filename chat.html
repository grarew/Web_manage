<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 活动助手</title>
<style>
/* ===== 样式：配色跟首页一致 ===== */
:root{--main:#5b6ef5;--main2:#8b5cf6;--bg:#f4f6fc;--line:#e8ebf5;--text:#1f2430}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;height:100vh;display:flex;
  flex-direction:column;background:var(--bg);color:var(--text)}

/* 顶部导航 */
header{background:linear-gradient(120deg,var(--main),var(--main2));color:#fff;
  padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(91,110,245,.3)}
header h1{font-size:18px}
header .sub{font-size:12px;opacity:.85}
header .spacer{flex:1}
header a{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.18);
  padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28)}
header a:hover{background:rgba(255,255,255,.3)}

/* 消息区 */
#chatbox{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:74%;padding:11px 15px;border-radius:14px;line-height:1.7;font-size:15px;
  white-space:pre-wrap;word-break:break-word;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:linear-gradient(120deg,var(--main),var(--main2));
  color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line);
  border-bottom-left-radius:4px;box-shadow:0 2px 10px rgba(30,45,90,.06)}
.msg.notice{align-self:center;background:#fff7e6;color:#a8761a;border:1px solid #ffe0a3;
  font-size:12px;padding:6px 12px;border-radius:999px}
.msg.error{align-self:flex-start;background:#fdeaea;color:#c0392b;border:1px solid #f5c6c6}
.cursor{display:inline-block;width:7px;height:15px;background:var(--main);
  vertical-align:text-bottom;margin-left:3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 输入区 */
footer{padding:12px 20px;background:#fff;border-top:1px solid var(--line)}
.input-row{display:flex;gap:10px;align-items:flex-end;max-width:900px;margin:0 auto}
textarea{flex:1;resize:none;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
  font-size:15px;font-family:inherit;line-height:1.5;min-height:46px;max-height:120px;outline:none}
textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(91,110,245,.12)}
button{padding:11px 22px;border:0;border-radius:12px;background:var(--main);color:#fff;
  font-size:15px;cursor:pointer;white-space:nowrap;transition:.15s}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:not-allowed}
#stopBtn{background:#e05555}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>💬 AI 活动助手</h1>
  <span class="sub">流式对话 · DeepSeek</span>
  <span class="spacer"></span>
  <a href="index.html">← 返回活动管理</a>
</header>

<div id="chatbox"></div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="问我关于活动的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="sendBtn">发送</button>
    <button id="stopBtn" hidden>停止生成</button>
  </div>
</footer>

<script src="config.js"></script>
<script>
/* ===== 逻辑：发消息给后端，AI 的回答一个字一个字流回来 ===== */
const $ = id => document.getElementById(id);
const API = String((window.APP_CONFIG || {}).API_BASE || '').replace(/\/+$/, '');
const chatbox = $('chatbox'), input = $('input'), sendBtn = $('sendBtn'), stopBtn = $('stopBtn');

let history = [];      // 对话历史
let streaming = false; // 是否正在生成
let aborter = null;    // 用来"停止生成"
let bubble = null;     // 当前 AI 消息气泡
let text = '';         // 当前气泡累积的文字

/* 加一条消息气泡（role 决定样式：user / assistant / notice / error） */
function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatbox.appendChild(div);
  chatbox.scrollTop = chatbox.scrollHeight;
  return div;
}

/* 收尾当前气泡：有内容就存进历史，空回复就删掉 */
function finalize() {
  if (!bubble) return;
  const t = bubble.textContent.trim();
  if (t) history.push({ role: 'assistant', content: t });
  else bubble.remove();
  bubble = null;
}

/* 切换"发送中"状态 */
function setStreaming(on) {
  streaming = on;
  sendBtn.disabled = on;
  stopBtn.hidden = !on;
  input.disabled = on;
  if (!on) input.focus();
}

/* 裁剪历史，防止越聊越大 */
function trimHistory() {
  const MAX = 20;
  if (history.length > MAX) history = history.slice(-MAX);
  let total = history.reduce((n, m) => n + m.content.length, 0);
  while (total > 8000 && history.length > 2) {
    total -= history[0].content.length;
    history.shift();
  }
}

/* 发送消息 */
async function send() {
  const q = input.value.trim();
  if (!q || streaming) return;

  addMsg('user', q);
  history.push({ role: 'user', content: q });
  input.value = '';
  input.style.height = 'auto';

  bubble = addMsg('assistant', ''); // 先建一个空气泡，等文字流进来
  text = '';
  aborter = new AbortController();
  setStreaming(true);

  try {
    const res = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
      signal: aborter.signal
    });

    // 后端若直接返回 JSON 错误（没配 Key 等），先拦下来
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('text/event-stream')) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.msg || '请求失败（HTTP ' + res.status + '）');
    }

    // 读 SSE 流：每个事件用空行分隔
    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        let event = '', data = '';
        raw.split('\n').forEach(line => {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        });
        if (!data) continue;
        const payload = JSON.parse(data);
        if (event === 'delta') {
          text += payload.text || '';
          bubble.textContent = text;
          chatbox.scrollTop = chatbox.scrollHeight;
        } else if (event === 'notice') {
          addMsg('notice', payload.text || '');
        } else if (event === 'error') {
          finalize();
          addMsg('error', payload.message || '生成失败');
        } else if (event === 'done') {
          finalize();
        }
      }
    }
    trimHistory();
  } catch (e) {
    finalize();
    if (e.name === 'AbortError') addMsg('notice', '已停止生成。');
    else if (e.name === 'TypeError') addMsg('error', '无法连接后端。请确认已运行 node app.js。');
    else addMsg('error', e.message || '出错啦');
    trimHistory();
  } finally {
    aborter = null;
    setStreaming(false);
  }
}

/* 事件绑定 */
sendBtn.addEventListener('click', send);
stopBtn.addEventListener('click', () => aborter && aborter.abort());
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

/* 开场欢迎语 */
addMsg('assistant', '你好！我是 AI 活动助手，可以问我活动安排、日期、场地等问题～');
</script>
</body>
</html>
