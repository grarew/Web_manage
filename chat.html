<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 活动助手</title>

<style>
/* 颜色配置：改这一行就换整套配色（和首页保持一致） */
:root { --主色:#5b6ef5; --背景:#f4f6fc; --白:#fff; --字:#1f2430; --灰:#8a91a3; --线:#e8ebf5; --红:#e05555; }

/* ===== 样式 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: var(--背景); color: var(--字);
  height: 100vh; display: flex; flex-direction: column; }

header { background: var(--主色); color: #fff; padding: 12px 18px;
  display: flex; align-items: center; gap: 12px; }
header span { flex: 1; }
header a { color: #fff; font-size: 13px; text-decoration: none; }

/* 聊天区 */
#框 { flex: 1; overflow-y: auto; padding: 16px; display: flex;
  flex-direction: column; gap: 10px; }
.话 { max-width: 76%; padding: 10px 14px; border-radius: 12px; font-size: 15px;
  line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.我 { align-self: flex-end; background: var(--主色); color: #fff; }
.AI { align-self: flex-start; background: var(--白); border: 1px solid var(--线); }
.小提示 { align-self: center; color: var(--灰); font-size: 12px; }
.错 { align-self: flex-start; background: #fdeaea; color: var(--红); }

/* 输入区 */
footer { background: var(--白); border-top: 1px solid var(--线); padding: 10px 16px;
  display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; padding: 10px 12px; font-family: inherit;
  font-size: 15px; line-height: 1.5; min-height: 44px; max-height: 110px; outline: none;
  border: 1px solid var(--线); border-radius: 10px; }
textarea:focus { border-color: var(--主色); }
button { padding: 10px 18px; border: none; border-radius: 10px; font-size: 15px;
  background: var(--主色); color: #fff; cursor: pointer; }
button:disabled { opacity: .5; }
#停 { background: var(--红); }

[hidden] { display: none !important; }
</style>
</head>

<body>

<header>
  <b>💬 AI 活动助手</b>
  <span></span>
  <a href="index.html">← 返回</a>
</header>

<div id="框"></div>

<footer>
  <textarea id="问" placeholder="问我关于活动的问题…（Enter 发送）"></textarea>
  <button id="发">发送</button>
  <button id="停" hidden>停止</button>
</footer>

<script src="config.js"></script>
<script>
/* ===== 全部代码就这些 ===== */

var 地址 = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";
var 记录 = [];      // 之前聊过的话
var 在答 = false;   // 是否正在等 AI 回答
var 中断 = null;    // 用来点"停止"
var 气泡 = null;    // 正在显示的那条 AI 气泡
var 文字 = "";      // 这条气泡已收到的文字

function 取(id) { return document.getElementById(id); }

// 往聊天框加一条消息，并滚到最下面
function 加(类, 内容) {
  var 条 = document.createElement("div");
  条.className = "话 " + 类;
  条.textContent = 内容;
  取("框").appendChild(条);
  取("框").scrollTop = 取("框").scrollHeight;
  return 条;
}

// 一条 AI 回答结束：有内容就记住，空的就删掉
function 收尾() {
  if (!气泡) return;
  var 内容 = 气泡.textContent.trim();
  if (内容) 记录.push({ role: "assistant", content: 内容 });
  else 气泡.remove();
  气泡 = null;
}

// ---------- 发送 ----------
async function 发送() {
  var 问 = 取("问").value.trim();
  if (!问 || 在答) return;

  加("我", 问);
  记录.push({ role: "user", content: 问 });
  取("问").value = "";

  气泡 = 加("AI", "");     // 先放个空气泡，等文字流进来
  文字 = "";
  中断 = new AbortController();
  在答 = true;
  取("发").disabled = true;
  取("停").hidden = false;
  取("问").disabled = true;

  try {
    var 回应 = await fetch(地址 + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: 记录 }),
      signal: 中断.signal
    });

    // 后端直接报错（比如没配 Key）
    if (!(回应.headers.get("content-type") || "").includes("event-stream")) {
      var 错 = await 回应.json();
      throw new Error(错.msg || "请求失败");
    }

    // 一块一块读，边收边贴到屏幕上
    var 读 = 回应.body.getReader();
    var 解码 = new TextDecoder("utf-8");
    var 存 = "";

    while (true) {
      var 块 = await 读.read();
      if (块.done) break;
      存 += 解码.decode(块.value, { stream: true });

      var 段们 = 存.split("\n\n");
      存 = 段们.pop();       // 最后一段可能没读完，留到下一轮
      for (var i = 0; i < 段们.length; i++) {
        var 名 = 段们[i].match(/event: ?(.*)/);
        var 数 = 段们[i].match(/data: ?(.*)/);
        if (!数) continue;
        var 内容 = JSON.parse(数[1]);
        名 = 名 ? 名[1] : "";

        if (名 === "delta") {            // 文字流
          文字 += 内容.text || "";
          气泡.textContent = 文字;
          取("框").scrollTop = 取("框").scrollHeight;
        } else if (名 === "notice") {    // 系统提示，如"已新增活动"
          加("小提示", 内容.text);
        } else if (名 === "error") {     // 出错
          收尾();
          加("错", 内容.message);
        } else if (名 === "done") {      // 回答结束
          收尾();
        }
      }
    }

    if (记录.length > 20) 记录 = 记录.slice(-20);   // 别让记录无限变长

  } catch (错) {
    收尾();
    if (错.name === "AbortError") 加("小提示", "已停止");
    else if (错.name === "TypeError") 加("错", "连不上后端，请先运行 node app.js");
    else 加("错", 错.message);
  } finally {
    中断 = null;
    在答 = false;
    取("发").disabled = false;
    取("停").hidden = true;
    取("问").disabled = false;
    取("问").focus();
  }
}

// ---------- 启动 ----------
取("发").onclick = 发送;
取("停").onclick = function () { if (中断) 中断.abort(); };

// Enter 发送，Shift+Enter 换行
取("问").onkeydown = function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); 发送(); }
};

// 输入框跟着内容长高
取("问").oninput = function () {
  取("问").style.height = "auto";
  取("问").style.height = Math.min(取("问").scrollHeight, 110) + "px";
};

加("AI", "你好！问我活动安排、日期、地点都可以～");
</script>
</body>
</html>
